<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset -->
    <meta charset="utf-8" />

    <!-- Mobile viewport and UI scaling -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />

    <!-- SPA universal base -->
    <base href="/" />

    <!-- Title -->
    <title>Mavis - Personal AI Assistant</title>

    <!-- Primary description -->
    <meta
      name="description"
      content="Mavis is an open-source personal AI assistant."
    />

    <!-- Keywords (not required but still used by some engines) -->
    <meta
      name="keywords"
      content="gratitude app, gratitude journal, journaling, positive mindset, daily gratitude, mental health app, habit building"
    />

    <!-- Author -->
    <meta name="author" content="Regis Moura Dantas" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-icon-180.png" />

    <!-- Preload fonts for faster LCP -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/roboto-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/roboto-700.woff2" />

    <!-- Google Fonts fallback (if you don't host fonts locally) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Mavis - Personal AI Assistant" />
    <meta
      property="og:description"
      content="Mavis is an open-source personal AI assistant."
    />
    <meta property="og:image" content="https://mavis.ai/og-image.jpg" />
    <meta property="og:url" content="https://mavis.ai" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mavis" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mavis - Personal AI Assistant" />
    <meta
      name="twitter:description"
      content="Mavis is an open-source personal AI assistant."
    />
    <meta name="twitter:image" content="https://mavis.ai/og-image.jpg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://mavis.ai/" />

    <!-- Structured Data | SEO Power Boost -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Mavis",
        "operatingSystem": "All",
        "applicationCategory": "LifestyleApplication",
        "description": "Mavis is an open-source personal AI assistant.",
        "url": "https://mavis.ai",
        "author": {
          "@type": "Person",
          "name": "Regis Moura Dantas"
        },
        "image": "https://mavis.ai/og-image.jpg",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5",
          "ratingCount": "37"
        }
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
